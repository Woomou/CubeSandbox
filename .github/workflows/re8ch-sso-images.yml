name: Build Re8ch SSO images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: cube-ops
            dockerfile: CubeOps/Dockerfile
          - image: cube-webui
            dockerfile: deploy/one-click/webui/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            CUBE_VERSION=re8ch-sso-${{ github.sha }}
            CUBE_COMMIT=${{ github.sha }}
            CUBE_BUILD_TIME=${{ github.run_id }}
          tags: ghcr.io/woomou/cubesandbox-${{ matrix.image }}:${{ github.sha }}
